name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint (Errors Only)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint (errors only)
        run: yarn eslint . --quiet

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck framework
        run: yarn workspace @mercurjs/framework tsc --noEmit -p tsconfig.json

      - name: Typecheck storefront
        run: yarn workspace storefront tsc --noEmit -p tsconfig.json

      - name: Build local Mercur packages required by backend typecheck
        run: |
          yarn workspace @mercurjs/framework build
          yarn workspace @mercurjs/b2c-core build
          yarn workspace @mercurjs/commission build

      - name: Typecheck backend
        run: yarn workspace api tsc --noEmit -p tsconfig.json

      - name: Typecheck modules
        run: |
          yarn workspace @mercurjs/algolia tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/b2c-core tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/commission tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/payment-stripe-connect tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/requests tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/resend tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/reviews tsc --noEmit -p tsconfig.json
          yarn workspace @mercurjs/stripe-tax-provider tsc --noEmit -p tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci
      STORE_CORS: http://localhost:3002
      ADMIN_CORS: http://localhost:7001
      AUTH_CORS: http://localhost:3002
      VENDOR_CORS: http://localhost:3002
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ci_placeholder_publishable_key
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build monorepo
        run: yarn build

  seed-smoke:
    name: Seed Smoke-Test
    runs-on: ubuntu-latest
    needs:
      - build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d medusa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci
      REDIS_URL: redis://localhost:6379
      DISABLE_ALGOLIA: "true"
      ALGOLIA_APP_ID: CI_DUMMY_APP_ID
      ALGOLIA_API_KEY: CI_DUMMY_API_KEY
      STORE_CORS: http://localhost:3002
      ADMIN_CORS: http://localhost:7001
      AUTH_CORS: http://localhost:3002
      VENDOR_CORS: http://localhost:3002
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build local Mercur packages required by seed
        run: |
          yarn workspace @mercurjs/framework build
          yarn workspace @mercurjs/algolia build
          yarn workspace @mercurjs/b2c-core build
          yarn workspace @mercurjs/commission build
          yarn workspace @mercurjs/payment-stripe-connect build
          yarn workspace @mercurjs/requests build
          yarn workspace @mercurjs/resend build
          yarn workspace @mercurjs/reviews build
          yarn workspace @mercurjs/stripe-tax-provider build

      - name: Run DB migrations
        run: yarn workspace api db:migrate

      - name: Run seed smoke-test
        run: DISABLE_ALGOLIA=true ALGOLIA_APP_ID=CI_DUMMY_APP_ID ALGOLIA_API_KEY=CI_DUMMY_API_KEY REDIS_URL=redis://localhost:6379 yarn workspace api seed
